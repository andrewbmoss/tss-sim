  # -- verified by analysis, inspection or a stand-alone study ----------------
  SCI-02:
    category: analysis
    work_packages: [WP0]
    reason: >-
      The hmF2 distribution against the MIS-01 envelope, from the band-edge
      runs (study min_frequency; scripts/sci02_threshold.py).  WP0 Phase 3
      (2026-10-20): threshold met over 600-900 km at every solar level; hmF2
      0.1/99.9 percentiles inside 200-500 km in all 94 cells (extremes 194 and
      536 km).  At 500 km and solar maximum the peak is above the spacecraft
      in 0.03-0.07 per cent of samples (by up to 36 km): Rev G's MIS-01 "at
      all times sampled" is not met there, MIS-01 as restated at G3 (at least
      99.9 per cent of samples, 2026-10-20) is, with the worst cell at 99.93
      per cent.  Storm-time hmF2 uplift is outside IRI and not verified.  docs/band-edge.md, Phase 3.  Goal (h_sat to 1400 km): WP0
      Phase 4 gives 65 per cent coverage and 0.89 mean altitude completeness
      at 1400 km from a 0.33 MHz start at a deep minimum (docs/band-edge.md,
      Phase 4); ISIS-1 at 900-1400 km (Phase 5) bounds it at 45 per cent.
      G2 (Andrew, 2026-10-20, confirmed after Phase 5): the requirement stays
      as it is; the exceedances and the inadequacy of the measured record are
      discussed in the Technical Volume and dissertation.
  SCI-20:
    category: analysis
    reason: >-
      The noise reference L2 uses (Franklin and MacLean 1969).  Checked by the
      V3 replication franklin_maclean_1969_sky_noise and by WP12, not per run.
  INS-13:
    category: analysis
    work_packages: [WP0]
    reason: >-
      Data-volume arithmetic, tss study data_volume (WP0 Phase 7,
      2026-10-20; docs/data-volume.md).  Products per observing mode and the
      threshold and goal product sets; A1 at 900 km is 109 MB/day at threshold
      and 435 MB/day at goal, back to back.  Downlink, contacts and processing
      are mission designs (Andrew, 2026-10-20); the redrafted INS-13, a new
      INS-28 (on-board product generation) and a proposed MIS-11 (data-handling
      declaration, gate G5) go into the Rev G amendment.
  INS-19:
    category: analysis
    work_packages: [WP0]
    reason: >-
      Data-volume arithmetic for the vector configuration (tss study
      data_volume): raw x3.0, L1b x2.0, threshold set x2.3, goal set x2.7.
  INS-20:
    category: analysis
    reason: >-
      A declaration of the resonant length and the efficiency of shorter
      antennas, made by the antenna model and the antenna_scale study.
  INS-21:
    category: analysis
    reason: >-
      An architectural constraint verified by schematic review.  L2 assumes it
      (oscillator single_reference), which is what earns the range-correlation
      credit.
  INS-27:
    category: analysis
    reason: >-
      Programmability of the sweep, verified by command-set review and bench
      capture.  The simulator already takes the sweep law as configuration.
  INS-28:
    category: bench
    work_packages: [WP0, WP9]
    reason: >-
      On-board product generation (new 2026-10-20, WP0 closure): L1b traces
      and L2 profiles formed from every ionogram at cadence, verified on the
      prototype from recorded sweeps.  What is produced is defined by INS-13
      and sized by tss study data_volume; the processor is a mission design.

  # -- verified on hardware or in orbit ----------------------------------------
  SCI-17:
    category: bench
    reason: GNSS receiver specification and a PPS timing test on the prototype.
  INS-12:
    category: bench
    reason: PPS against GNSS timing.
  INS-22:
    category: bench
    reason: >-
      Spectrum analyser on the radiated chirp.  Its effect on the de-chirped
      residual enters simulation through the WP3 leakage model, which is a stub.
  INS-25:
    category: bench
    reason: >-
      Time-frequency analysis of the chirp.  The L2 tier generates the ideal
      sweep law and ignores nonlinearity_ppm.

  # -- mission level ---------------------------------------------------------------
  SCI-10:
    category: mission
    reason: Constellation revisit; a single spacecraft cannot meet it (Open Item 6).
  SCI-11:
    category: mission
    reason: Latitude, longitude and local-time coverage, by orbit propagation.
  SCI-12:
    category: mission
    reason: Mission duration against the solar cycle.
  SCI-24:
    category: mission
    reason: Post-sunset revisit, by constellation coverage (Open Item 6).
  SCI-26:
    category: mission
    reason: Local-time coverage of the bubble sector, by orbit propagation.
  MIS-01:
    category: mission
    reason: >-
      Orbit altitude.  The campaign configurations sample it (500 and 800 km);
      none yet sits at the 900 km governing case.  G3 decision (Andrew,
      2026-10-20): Rev G's "must be above the F2 peak at all times sampled" is
      to be restated as a fraction of samples, set here at 99.9 per cent
      (tss.studies.sci02_margin.MIS01_ABOVE_PEAK_FRACTION) to match the
      0.1/99.9 percentile reading of SCI-02's envelope.  Met in all 94 cells of
      WP0 Phase 3; the worst is 99.93 per cent (O2, 500 km, solar maximum
      2000-01).  Goes into the requirements document with the WP0 close-out.
  MIS-02:
    category: mission
    reason: Inclination by orbit class.
  MIS-03:
    category: mission
    reason: Nodal precession through 24 h of local time.
  MIS-04:
    category: mission
    reason: Mission duration.
  MIS-05:
    category: mission
    reason: Constellation size (Open Item 6).
  MIS-06:
    category: mission
    reason: >-
      Inter-satellite geometry for oblique links; studied by route_two_network
      and the Chartier reproduction, not scored per run.
  MIS-07:
    category: mission
    reason: Local-time sampling of the bubble sector.
  MIS-08:
    category: mission
    reason: Configuration declaration.
  MIS-09:
    category: mission
    reason: Antenna declaration.
  MIS-10:
    category: mission
    reason: >-
      Phasing of the second look, by orbit propagation; the route_two study
      uses it.
  MIS-11:
    category: mission
    reason: >-
      Data-handling declaration (new 2026-10-20, WP0 closure, gate G5): each
      mission declares its duty cycle, INS-13 product set and daily volume and
      shows its downlink and storage carry it.  Verified by declaration review
      against tss study data_volume.

  # -- requirements on tss-sim itself ---------------------------------------------
  SW-01:
    category: software
    reason: >-
      Retrieval scoring against truth.  Implemented for the density and height
      errors over the topside; NmF2, hmF2 and 1 sigma coverage are not (see
      SCI-01 and SCI-18).
  SW-02:
    category: software
    reason: >-
      Measured ionospheres as L0 truth, including the archived-trace check
      against ISIS-1.  Data sources exist; the L0 tiers and the trace check do
      not.
  SW-03:
    category: software
    reason: >-
      Absolute density and a mode-mislabel injection.  Not implemented.
  SW-04:
    category: software
    reason: Storm-time L0 states and metrics by Kp class.  Not implemented.

