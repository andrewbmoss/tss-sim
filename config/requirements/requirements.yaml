# The requirement set, machine readable.
#
# This file is the only thing L5 scores against.  The first governing principle
# of Section 3.1 of the proposal is that no simulated performance figure is
# scored pass or fail until the number it is scored against exists and is traced
# to a source, and this file is that principle in code.
#
# Schema per entry, documented in docs/requirements-traceability.md:
#   title          one line, as it reads in the requirements document
#   sense          min | max | range | bool     which direction is better
#   unit           the unit of threshold and goal
#   threshold      the number that must be met.  A [lower, upper] pair for a range.
#   goal           the number worth reaching.  May be null.
#   claims         the claims (C1..C5) this requirement helps resolve
#   work_packages  the packages that validate it
#   source         where the number came from.  An entry with no source cannot
#                  be used to score, and `tss requirements` will fail on it.
#   derivation     required when source is `derived`; names the derivation
#   notes          anything a reader needs in order to not misread the entry
#
# STATUS (2026-10-17): the full Rev G set is accounted for.  The catalogue named
# under `catalog:` is generated from TSS_SRM_RevG.xlsx by scripts/import_srm.py
# and holds all seventy requirements: twenty-eight measurement, twenty-eight
# instrument, ten mission and four software.  Every one of them is either a
# scored entry under `requirements:` or listed under `not_scored:` with a
# category and a reason, and `tss requirements` fails if one is in neither.
# The scored entries are the claim-bearing requirements of Table 3.1 of the
# proposal (INS-01 split into INS-01a and INS-01b), SCI-05 and SCI-07, which
# Rev G scores in simulation against truth (SW-01), and INS-03.  SCI-15 was in
# Table 3.1 and missing from this file until 2026-10-17.  The categories of
# `not_scored` are documented in tss/requirements.py.
#
# Rev G (2026-09-28): INS-01 split so each edge can be scored; INS-02 cap scoped
# above the X-mode cutoff; INS-09 given a frame and a Doppler mode; INS-11
# stated at the digitiser input; INS-15 and INS-26 re-derived from SCI-15;
# SCI-23 restated as a drift accuracy met by a second look; SCI-05 and SCI-07
# added.  Requires the matching rows in l5_assessment/requirements_check.py.
#
# Rev F alignment (2026-09-27): every threshold and goal here now matches the
# requirements document.  Six goals that the document does not state were set
# to null (INS-10, INS-11, INS-14, INS-18, INS-24, INS-26; INS-26's goal was
# later restored at 3.7e-9 in Rev G, 3.2e-9 after 2026-10-06); each entry's notes
# record the value it used to carry.  With a null goal the best verdict is
# "threshold", so scores on those entries can drop from "goal" to "threshold"
# with no change in performance.
#
# To take in a new SRM revision: run `python scripts/import_srm.py <workbook>`,
# review the diff of srm_catalog.yaml, amend the scored entries and the
# not_scored reasons whose text changed, and run `tss requirements`.

revision: "G"
source_document: "TSS_Science_Requirements_RevG.docx"
source_matrix: "TSS_SRM_RevG.xlsx"
catalog: requirements/srm_catalog

requirements:

  INS-01a:
    title: Lowest sounding frequency
    sense: max
    unit: Hz
    threshold: 3.3e+5
    goal: 2.6e+5
    claims: [C1, C2]
    work_packages: [WP0, WP1, WP3, WP12]
    source: derived
    derivation: "Requirements Rev G INS-01a, sec. 5.6 and 5.7: band-edge study, 1.2e6 IRI-2020 samples across 60 configurations, ensemble combined at the minimum of the per-model 5th percentiles; method checked against 5118 hand-scaled ISIS-1 profiles"
    notes: >-
      Split from Rev F's INS-01 so the lower edge can be scored: lower is
      better.  The lower edge is the 95 per cent profile-coverage point over the
      full mission envelope (500 to 900 km, either orbit class, a complete solar
      cycle); the goal is the 99 per cent point.  The governing case is O1 at
      900 km at solar minimum.  Tolerance is one-sided, -20%/+0%.  A mission
      declaring solar maximum only may use 0.90 MHz.  In the 61 solar-minimum
      ISIS-1 records four observations fall below 0.33 MHz where the models give
      about 0.6 MHz, so the threshold is not assumed conservative (Open Item 2).
      Scored from the metric sweep_min_frequency_hz, the lowest frequency the
      transmitted sweep covered.  The lowest detected echo is set by the
      ionosphere and is only a diagnostic.

  INS-01b:
    title: Highest sounding frequency
    sense: min
    unit: Hz
    threshold: 2.0e+7
    goal: null
    claims: [C1, C2]
    work_packages: [WP0, WP1]
    source: derived
    derivation: "Requirements Rev G INS-01b: 20 MHz covers 5e12 m^-3 (SCI-03); median foF2 along track peaks at 10.19 MHz at solar maximum (Finding F11)"
    notes: >-
      Split from Rev F's INS-01.  Higher is better.  Stating the edge against a
      percentile of foF2 rather than the median is Open Item 5.  Scored from the
      metric sweep_max_frequency_hz, the highest frequency the transmitted sweep
      covered, not from the highest detected echo, which is fxF2.

  INS-02:
    title: Frequency step law
    sense: max
    unit: fraction of f, capped at 150 kHz
    threshold: 0.05
    goal: 0.025
    claims: [C2]
    work_packages: [WP0, WP4, WP7]
    source: derived
    derivation: "dNe/Ne = 2 df/f with the density precision of SCI-04; the 150 kHz cap from O/X separation (SCI-14, SCI-27); crossover at 3 MHz"
    notes: >-
      Scored as df <= min(0.05 f, 150 kHz).  Rev G applies the 150 kHz cap only
      above the X-mode cutoff at the spacecraft, f_x = f_ce/2 + sqrt((f_ce/2)^2
      + f_N^2), 0.62 to 1.53 MHz over 500 to 900 km at f_N = 0.33 MHz; below it
      only the O mode exists.  This does not change the step count, since the
      cap binds only above 3 MHz.  The cap is dropped in configuration A2,
      where polarization separates the O and X traces.

  INS-03:
    title: Frequency steps per ionogram
    sense: min
    unit: steps
    threshold: 159
    goal: 211
    claims: [C2]
    work_packages: [WP0, WP4]
    source: derived
    derivation: "Requirements Rev G INS-03: the INS-02 step law run over the INS-01a and INS-01b band, 0.33 to 20 MHz, in configuration A1: 159 steps at min(0.05 f, 150 kHz), 211 at the 0.025 f goal"
    notes: >-
      Configuration A1 values.  Configuration A2 is 85 threshold and 167 goal,
      because it drops the 150 kHz cap, and needs its own entry when an A2
      campaign exists; scored against this entry an A2 sweep would fail.
      Scored from frequency_step_count, the number of ionogram columns the
      sweep produced.  The count follows from INS-01a and INS-02 together, so a
      sweep that starts above 0.33 MHz fails this as well as INS-01a.

  INS-04:
    title: Unambiguous range
    sense: min
    unit: m
    threshold: 1.05e+6
    goal: 1.5e+6
    claims: [C1, C2]
    work_packages: [WP3, WP4]
    source: derived
    derivation: "SCI-08: apparent range at least 1.5 times the maximum true range so foF2 and fxF2 can be read (Franklin and MacLean 1969); 1.5 x (900 - 200) km over the MIS-01 envelope (Rev G, amended 2026-09-29)"
    notes: >-
      Raised from 1000 km, which served only spacecraft at or below 800 km, to
      1050 km for the 900 km top of MIS-01 with hmF2 at 200 km.  Known artefact
      (code review, 2026-10-17): the metric unambiguous_range_m is c fs / (4 K_f)
      with the sample rate the L2 baseline tier picked for the run, and that
      tier picks fs as 2.5 times the largest beat among the simulated echoes.
      The scored value is therefore 1.25 times the deepest simulated echo, not
      a property of the instrument, and a verdict on this entry says nothing
      about the design until L2 takes its digitiser rate from the instrument
      configuration (INS-06).

  INS-05:
    title: Virtual range resolution
    sense: max
    unit: m
    # Stated per band (Rev G, amended 2026-09-30).  The top-level values are
    # the strictest band's and are used only when a run reports one resolution
    # with no frequencies.
    threshold: 1.0e+4
    goal: 5.0e+3
    bands:
      - {f_max_hz: 5.0e+5, threshold: 1.5e+4, goal: 1.0e+4}
      - {f_min_hz: 5.0e+5, f_max_hz: 7.0e+5, threshold: 1.0e+4, goal: 1.0e+4}
      - {f_min_hz: 7.0e+5, threshold: 1.0e+4, goal: 5.0e+3}
    claims: [C2]
    work_packages: [WP4, WP6]
    source: derived
    derivation: "SCI-06 vertical structure, per band: 10 km threshold at and above 0.5 MHz and 15 km below; 5 km goal at and above 0.7 MHz and 10 km below (Rev G section 5.2)"
    notes: >-
      The range cell of one dwell is c ENBW / (2 df), and INS-02's step of
      0.05 f makes it about 3000 ENBW / f km below 3 MHz, with f at the step's
      lower edge.  With a Hann window it is 13.6 km at 0.33 MHz and 9.0 km at
      0.5 MHz; without a window it is 9.1 km at 0.33 MHz and 4.3 km at 0.7 MHz.  The band edges sit where each
      value closes with margin: the threshold with Hann, the goal without a
      window.  Frequencies below 0.45 MHz sound
      only the lowest-density topside (solar minimum, 800 to 900 km, night,
      high latitude: at most about 5 to 10 percent of profiles in the governing
      cell), where the profile is smooth and scale heights are large (150 +/-
      30 km at night, Meehan), so 15 km is H/10 and matches the 15 km of the
      Alouette and ISIS record.  The loss is finer resolution of the borders of
      the deepest depletions.  Declared conflict: under INS-02's goal step of
      0.025 f the cell doubles below 6 MHz, so the INS-02 goal and INS-05 cannot
      both be met at the bottom of the band (SCI-04 against SCI-06); a mission
      chooses.

  INS-07:
    title: Ionogram period
    sense: max
    unit: s
    threshold: 6.7
    goal: 3.3
    claims: [C2]
    work_packages: [WP4, WP7]
    source: derived
    derivation: "Along-track sampling of SCI-09 and SCI-22 at 7.5 km/s"

  INS-08:
    title: Mode discrimination
    sense: bool
    unit: ""
    threshold: true
    goal: null
    claims: [C5]
    work_packages: [WP11]
    source: "SCI-14; Reinisch et al. 2001, Radio Plasma Imager on IMAGE"
    notes: Detect and label the ordinary and extraordinary traces.

  INS-09:
    title: Doppler measurement
    sense: max
    unit: range cell
    threshold: 1.0
    goal: null
    claims: [C3]
    work_packages: [WP5, WP6]
    source: derived
    derivation: "SCI-15 and SCI-16; dd = mu_sat v f / K_f, evaluated at its upper bound mu_sat = 1, bounded to one range cell as defined in Requirements Rev G sec. 1 (amended 2026-09-29), sec. 5.4"
    notes: >-
      Scored as the residual apparent-range bias in range cells after the WP5
      processing.  The range cell is the resolution of one analysis dwell,
      c / (2 K_f T_dwell), which for the A1 stepped sweep is 1.0 km above 3 MHz
      and 9.1 km at 0.33 MHz.  It is not the 10 km INS-05 threshold and not the
      10 km bins of the INS-13 product.  This is the ionogram-mode part of INS-09.  The
      Doppler-mode part (plus or minus 1 km/s unambiguous and 100 m/s
      resolution, in the Earth-fixed frame after the ephemeris-predicted
      platform term is removed) is not scored by this entry; Rev G states that
      the two modes need not run simultaneously.  The bias is set by the total
      line-of-sight velocity: 475 m at 20 MHz for a one-degree tilt, but 2.4 km
      for a five-degree tilt, which is several cells.

  INS-10:
    title: Sensitivity
    sense: min
    unit: dB
    threshold: 10.0
    goal: null
    claims: [C1]
    work_packages: [WP3, WP12]
    source: derived
    derivation: "Corrected sensitivity model against the Franklin and MacLean 1969 in-orbit sky noise measurement"
    notes: >-
      SNR per range cell at maximum range, across the band.  Resolved
      affirmative with large margin over the band where a measured noise
      reference exists.  Below 0.6 MHz the reference is an extrapolation, which
      is what WP12 exists to close.  Rev G adds an availability clause: the
      10 dB holds in the fraction of sweeps SCI-28 requires, outside declared
      interference intervals.  SCI-28's value is TBD (Open Item 14), so only
      the SNR is scored.  INS-10 states no goal in the requirement
      document; the 20 dB previously carried here is SCI-19's goal, which
      applies wherever phase or Doppler is measured, not to trace detection.

  INS-11:
    title: Receiver dynamic range, instantaneous, at the digitiser input
    sense: min
    unit: dB
    threshold: 60.0
    goal: null
    claims: [C4]
    work_packages: [WP3, WP5, WP9]
    source: "Reinisch et al. 2001 (RPI: 60 dB instantaneous plus 66 dB AGC); SCI-21"
    notes: >-
      Rev G states the reference point: the digitiser input, after analog
      de-chirp and a high-pass filter that removes the de-chirped leakage before
      digitisation.  The filter must reject the leakage carrier by the
      leakage-over-echo ratio less 60 dB plus 10 dB of headroom, 32 dB at
      INS-23's 40 dB isolation (Requirements Rev G sec. 5.9).  INS-11 also
      requires 90 dB with gain control and survival at +120 dB (Franklin and
      MacLean 1969); neither companion condition is scored by this entry.

  INS-14:
    title: Resource constraint, transmit power
    sense: max
    unit: W
    threshold: 1.0
    goal: null
    claims: [C1, C2]
    work_packages: [WP3, WP7]
    source: "TISC proposal baseline (programmatic, not science-derived)"
    notes: >-
      INS-14 is a single constraint: 6U volume, transmit power at most 1 W and
      total instrument power at most 5 W.  Only the transmit power is scored by
      this entry.  The requirement document states no goal; the 0.5 W
      previously carried here had no source.

  INS-15:
    title: Coherent processing interval
    sense: min
    unit: s
    threshold: 0.05
    goal: 1.15
    claims: [C3]
    work_packages: [WP5]
    source: derived
    derivation: "Threshold: the interval that gives the SCI-15 accuracy of 100 m/s (1 sigma) at 3 MHz, 10 dB per sub-sweep and 40 Hz, sigma_v = (c / 2 f mu_sat) sqrt(6) / (2 pi T sqrt(rho F_r T)). Goal: T >= c / (2 delta_v f mu_sat) at 3 MHz for the SCI-15 goal resolution of 50 m/s. Both at mu_sat = 0.87, the refractive index at the spacecraft at twice the local plasma frequency. Requirements Rev G sec. 5.4 and 5.10 (amended 2026-10-06)"
    notes: >-
      Accuracy is the SCI-15 threshold and resolution its goal (Rev G amendment
      of 2026-09-29).  The threshold interval scales as (f mu_sat)^(-2/3); the
      goal product f*T*mu_sat = 3.0e6 Hz s holds at every frequency.  The
      Doppler relations carry mu_sat, the refractive index at the spacecraft
      (amendment of 2026-10-06), and the values are sized at twice the plasma
      frequency at the spacecraft; the goal was 1.0 s in free space.  Rev F took 1.0 s and
      2.0 s from SCI-23, and Rev G first took 0.5 s from a threshold
      resolution.  The requirement includes compensation for the change in
      geometry over the interval.

  INS-18:
    title: Vector receive channel phase match
    sense: max
    unit: deg
    threshold: 2.0
    goal: null
    claims: [C5]
    work_packages: [WP11]
    source: derived
    derivation: "Arrival-angle goal of SCI-27 (2 degrees); channels phase-matched to 2 degrees across the band, or calibratable to that level in flight"
    notes: >-
      Three mutually orthogonal receive antennas and three phase-coherent
      channels; a mission may populate one.  Serves goal-level SCI-25 and
      SCI-27; no threshold requirement depends on it.  The requirement document
      states no goal; the 1 degree previously carried here was SCI-27's
      arrival-angle figure at SNR of 40 dB or more, not a phase-match goal.

  INS-23:
    title: Transmit to receive isolation
    sense: min
    unit: dB
    threshold: 40.0
    goal: 60.0
    claims: [C4]
    work_packages: [WP3, WP5, WP9]
    source: derived
    derivation: "Allocation to the INS-24 leakage floor (Requirements Rev G sec. 5.9); a deployed-configuration property that trades against INS-22"

  INS-24:
    title: Residual leakage floor
    sense: min
    unit: dB
    threshold: 10.0
    goal: null
    claims: [C4]
    work_packages: [WP3, WP5, WP9]
    source: derived
    derivation: "Ten decibels below the weakest echo INS-10 admits (Requirements Rev G sec. 5.9)"
    notes: >-
      Scored as the margin between the weakest admitted echo and the de-chirped
      leakage residual.  Technical Volume Chapter 5 shows this is less binding
      than earlier drafts asserted once range correlation is credited, but the
      credit depends on the single-reference architecture of INS-21.  The
      requirement document states no goal; the 20 dB previously carried here
      had no source.

  INS-26:
    title: Oscillator stability
    sense: max
    unit: Allan deviation
    threshold: 5.8e-8
    goal: 3.2e-9
    claims: [C3]
    work_packages: [WP3, WP5]
    source: derived
    derivation: "Threshold: one tenth of the SCI-15 accuracy of 100 m/s allocated to the oscillator, sigma_v = c sigma_y / (2 mu_sat). Goal: sigma_phi = 2 pi (f T) sigma_y(T) with f T = c / (2 delta_v mu_sat) at the SCI-15 goal resolution of 50 m/s, sigma_phi = 4 degrees (Poole 1985). Both at mu_sat = 0.87, the refractive index at the spacecraft at twice the local plasma frequency. Requirements Rev G sec. 5.4 and 5.10 (amended 2026-10-06)"
    notes: >-
      Scored at 0.05 s (threshold) and 1.15 s (goal).  The free-space values
      were 6.7e-8 and 3.7e-9 before the 2026-10-06 amendment carried the
      refractive index at the spacecraft.  Rev F's 2e-9 came from
      SCI-23 and is withdrawn, and Rev G's first 7.4e-9 came from a threshold
      resolution.  Open Item 12 is whether the range-correlation credit applies
      to the goal, which would relax it by a factor of about 26.

  SCI-05:
    title: Absolute electron density accuracy
    sense: max
    unit: fraction
    threshold: 0.15
    goal: 0.10
    claims: [C2, C5]
    work_packages: [WP4, WP11]
    source: "Requirements Rev G SCI-05; scored in simulation per SW-01"
    notes: >-
      Scored as the rms fractional density error of the L4 profile against its
      L0 truth (metric ne_rms_fractional).  In simulation the truth is absolute,
      so this is the simulated form of SCI-05.  The empirical checks (DMSP and
      ISIS-1 in-situ comparison, mode-mislabel injection) are SW-02 and SW-03.
      Scored only when the echoes were made with the magnetoionic group index
      and the inversion corrected for it (Rev G SW-01, amended 2026-10-06);
      otherwise not evaluated, with the reason recorded.

  SCI-07:
    title: Profile height accuracy
    sense: max
    unit: m
    threshold: 2.0e+4
    goal: 1.0e+4
    claims: [C2]
    work_packages: [WP4]
    source: "Requirements Rev G SCI-07; scored in simulation per SW-01"
    notes: >-
      Scored as the rms height error of the L4 profile points against their L0
      truth (metric height_error_rms_m).  Measured ionospheres used as truth
      (SW-02) make this a check against observation as well as model.
      Scored only when the echoes were made with the magnetoionic group index
      and the inversion corrected for it (Rev G SW-01, amended 2026-10-06).  A
      field-free inversion is in error by 14 to 34 km at mid and high magnetic
      latitude, which is the size of this requirement.

  SCI-09:
    title: Along-track sampling
    sense: max
    unit: m
    threshold: 5.0e+4
    goal: 2.5e+4
    claims: [C2]
    work_packages: [WP4, WP7]
    source: "Plasma bubble depletion envelope of about 300 km (302 +/- 41 km measured; GOLD sees a few to 10 degrees of longitude); Requirements Rev G Finding F7 and sec. 5.5"

  SCI-15:
    title: Line-of-sight Doppler velocity accuracy
    sense: max
    unit: m/s
    threshold: 100.0
    goal: 50.0
    claims: [C3]
    work_packages: [WP5]
    source: "Requirements Rev G SCI-15: drifts above 1 km/s outside the high-latitude convection region (Chartier 2022); substorm V* above 500 m/s (Poole 1985); RPI's +/-1 kHz requirement against aliasing from satellite motion (Reinisch et al. 2001)"
    notes: >-
      Scored as the 1-sigma accuracy of the line-of-sight velocity of an
      isolated echo, in the Earth-fixed frame after the ephemeris-predicted
      platform term is removed, in the Doppler observing mode (metric
      los_velocity_accuracy_mps).  Two parts of SCI-15 are not scored by this
      entry: the unambiguous interval (+/-1 km/s threshold, +/-1.5 km/s goal),
      and at goal the 50 m/s resolution between scatterers in one range cell;
      the goal value carried here is the 50 m/s accuracy.  The ionogram mode
      need not deliver SCI-15.  Not evaluated until the WP5 Doppler-mode tier
      reports the metric.  Carried in Table 3.1 of the proposal and absent from
      this file until 2026-10-17.

  SCI-23:
    title: Zonal drift accuracy of a depletion
    sense: max
    unit: m/s
    threshold: 50.0
    goal: 25.0
    claims: [C3]
    work_packages: [WP5, WP10]
    source: "Measured equatorial plasma bubble drifts, 75 to 250 m/s (Navas-Portella et al. 2025, J. Space Weather Space Clim. 15, 2, and studies compiled there)"
    notes: >-
      Rev G restates SCI-23 as the 1-sigma accuracy of the horizontal drift of
      a structure, in orbit class O2 or O3, measured from its displacement
      between a first and a second look (route two of Technical Volume Ch. 8):
      sigma_u = sqrt(2) sigma_x / dt.  With the A1 sweep the threshold needs a
      following node 4.4 to 10 minutes behind (MIS-10).  A nadir Doppler sees
      horizontal drift only through a layer tilt, so this is not a Doppler
      resolution, and INS-15 and INS-26 no longer derive from it.  The mapped
      metric drift_resolution_mps should be renamed for accuracy when WP5
      produces it.

# Every catalogue requirement that is not scored above, with the reason.  The
# categories are defined in tss/requirements.py (NOT_SCORED_CATEGORIES).
# `flowed_down` names the scored entries that carry it; `pending` names the
# work package that will produce its metric.

not_scored:

  # -- scored through the instrument requirements derived from them ----------
  SCI-03:
    category: flowed_down
    scored_through: [INS-01a, INS-01b]
    reason: >-
      Sets the sounding band through f_N = 8.98 sqrt(Ne); the band is scored as
      INS-01a and INS-01b.
  SCI-04:
    category: flowed_down
    scored_through: [INS-02]
    reason: >-
      dNe/Ne = 2 df/f, so the 10 and 5 per cent precision is the INS-02 step
      law, scored from the same metric (frequency_step_fraction_max).
  SCI-06:
    category: flowed_down
    scored_through: [INS-05]
    reason: >-
      The virtual range resolution part is scored per band as INS-05.  The
      height sampling part (20 km threshold, 10 km goal) is not yet a metric.
  SCI-08:
    category: flowed_down
    scored_through: [INS-04]
    reason: >-
      Apparent range of at least 1.5 times the true range is INS-04.  See the
      INS-04 note on why its present metric is a simulation artefact.
  SCI-14:
    category: flowed_down
    scored_through: [INS-08]
    reason: >-
      O and X detection and labelling above f_x is INS-08.  The Z-trace part
      below f_x is not modelled (no Z branch in L1).
  SCI-16:
    category: flowed_down
    scored_through: [INS-09]
    reason: >-
      The one-cell residual range bias is the ionogram-mode part of INS-09.
      SCI-16's 0.5-cell goal is not carried, because INS-09 states no goal.
  SCI-19:
    category: flowed_down
    scored_through: [INS-10]
    reason: >-
      The 10 dB trace-detection threshold is INS-10.  The 20 dB goal applies
      only where phase or Doppler is measured and belongs to the WP5
      Doppler-mode tier.
  SCI-21:
    category: flowed_down
    scored_through: [INS-11]
    reason: >-
      The 60 dB instantaneous and 90 dB gain-controlled dynamic range is
      INS-11.  Survival at +120 dB and narrowband excision are bench items.

  # -- scorable in simulation, metric not yet produced ------------------------
  SCI-01:
    category: pending
    work_packages: [WP6]
    reason: >-
      The profile is scored through SCI-05 and SCI-07.  The NmF2 and hmF2
      errors that SW-01 asks L5 for are not implemented.
  SCI-13:
    category: pending
    work_packages: [WP1]
    reason: >-
      Needs storm-day L0 states and every metric reported by Kp class (SW-04).
      The meaning of degraded but valid is Open Item 8.
  SCI-18:
    category: pending
    work_packages: [WP6]
    reason: >-
      Needs a per-point uncertainty from L4 and the fraction of points within
      their 1 sigma of truth (SW-01).  L4 does not yet propagate uncertainty.
  SCI-22:
    category: pending
    work_packages: [WP10]
    reason: >-
      Needs the depletion generator of tss.l0_ionosphere.perturbations, which
      is a stub.
  SCI-25:
    category: pending
    work_packages: [WP10, WP2]
    reason: >-
      Needs off-vertical echoes from a ray-traced L1 tier and a depletion wall
      (Open Item 10).  The ray-traced tier is a stub.
  SCI-27:
    category: pending
    work_packages: [WP11]
    reason: >-
      Goal level only: not required at threshold in any configuration.  Needs
      the six-component vector receive signal model; L2's extra channels are
