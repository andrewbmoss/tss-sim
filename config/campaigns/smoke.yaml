# The fastest campaign that exercises every layer.  Analytic throughout, one
# configuration, a coarse grid.  This is what CI and a new checkout run to
# confirm the pipeline is wired, and it makes no scientific claim.
name: smoke
tiers:
  l0: chapman
  l1: analytic
  l2: baseline
  # Pinned to the WP3-era fixed 10 dB detector (WP4 Phase 2): the smoke
  # numbers are cited by WP3 and its reference runs.  The default l3 detector
  # is now the stated-P_fa one of tss.l3_signal.detect.
  # and to the single transform of the whole dwell (dispersion: none), the
  # chain before gate G2 (2026-10-31) made the rate search the default.
  l3: {name: baseline, detector: fixed, dispersion: none}
  l4: lamination_magnetoionic
  l5: standard
configurations: [leo_500km_single]
grid:
  alt_step_m: 2.0e4
seed: 1
run:
  strict_provenance: false
# Pinned clutter-off (WP4 Phase 1): the smoke numbers are cited by WP3 and its
# reference runs, so they must keep reproducing.  wp4_campaign is the run with
# clutter on.
clutter:
  enabled: false
