# WP7.  Sweeps the configuration space and produces the feasibility surfaces.
# Slow.  Every point is a full pipeline run, and the result is reported per
# configuration rather than collapsed to a single verdict, because Section 1.3
# of the proposal reports per configuration.
name: trade_space
inherits: [campaigns/baseline]
tiers:
  l5: standard
configurations:
  - leo_500km_single
  - leo_800km_single
  - leo_500km_small_antenna
  - leo_500km_vector
sweep_over:
  antenna_length_m: [1.0, 2.0, 5.0, 10.0, 25.0]
  transmit_power_w: [0.1, 0.25, 0.5, 1.0]
  # Dwell per step of the stepped sweep, s.  At the 150 kHz step cap these are
  # peak rates of 1.0, 2.8, 5.6 and 11.2 MHz/s, the rates this axis used to
  # sweep directly.  13.4 ms is shorter than the 14.0 ms round trip to INS-04's
  # 1050 km and is kept as the edge of the space.
  step_dwell_s: [0.15, 0.0536, 0.0268, 0.0134]
run:
  strict_provenance: true
  keep_intermediates: false
