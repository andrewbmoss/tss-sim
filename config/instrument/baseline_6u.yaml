# The baseline instrument.  Numbers here are the threshold values of the Rev G
# requirement set, not aspirations, so a run against this configuration is a
# run against what the instrument must do rather than what it might do.
#
# Campaigns build the L2 tier from this file (tss.studies.build_instrument),
# with each configuration's antenna and receive overrides applied.  Until
# 2026-10-17 nothing read it and every campaign ran the L2 defaults.
name: baseline_6u

transmit:
  power_w: 1.0              # INS-14 threshold
  # 0 dB: the matching-network loss is part of the antenna's radiation
  # efficiency and is carried there and nowhere else (decision of 2026-10-17).
  # This file carried -20 dB here as well until then, which would have counted
  # the matching loss twice.
  efficiency_db: 0.0

antenna:
  kind: electrically_short_dipole
  length_m: 5.0
  directivity_dbi: 1.76     # short dipole, lossless
  # The radiation efficiency, matching-coil loss included, follows the sounding
  # frequency: it is the ShortDipole physical model's at every frequency
  # (decision of 2026-10-17), -46 dB at 0.33 MHz rising to -0.5 dB at 20 MHz for
  # this antenna.  This file stated a flat -20 dB until then.  These are the
  # model's inputs; a radiation_efficiency_db key here would replace the model
  # with a flat figure.
  radius_m: 5.0e-3
  coil_q: 150.0
  physical_temperature_k: 290.0

receiver:
  noise_figure_db: 3.0
  instantaneous_dynamic_range_db: 60.0   # INS-11 threshold
  gain_controlled_dynamic_range_db: 90.0
  channels: 1                            # 3 for the vector configuration, C5
  # Digitiser rate.  INS-06: fs >= 4 K_f R_max / c at the fastest rate the sweep
  # uses, with R_max the INS-04 threshold: 78.4 kHz at the A1 sweep's 5.6 MHz/s.
  # Give sample_rate_hz instead to fix the rate whatever the sweep.
  design_range_m: 1.05e+6

isolation:
  transmit_receive_db: 40.0   # INS-23 threshold
  coupling_delay_s: 3.0e-9    # open item 13, deployed geometry not yet fixed

oscillator:
  allan_deviation_1s: 2.0e-9  # the assumed part; INS-26 asks 5.8e-8 at 0.05 s and 3.2e-9 at 1.15 s
  allan_deviation_2s: 2.0e-9
  noise_type: flicker_fm      # sets the size of the range-correlation credit, open item 12
  single_reference: true      # INS-21; this is what earns the range-correlation credit

resources:
  volume_u: 6.0
  instrument_power_w: 5.0
