# Base configuration.  Every campaign inherits this and overrides what it needs.
# Nothing here is a scientific result; these are defaults that make a run
# possible, and a campaign that cares about a number states it explicitly.

name: default

paths:
  data_external: data/external      # download cache, gitignored
  data_reference: data/reference    # small checked-in reference values
  results: results                  # run outputs and manifests, gitignored
  figures: results/figures

# Which implementation answers for each layer.  `tss tiers` lists what is
# registered.  A campaign overrides any of these.  For IRI-2020 truth at L0 a
# campaign names the `iri` tier, whose `model` option picks the code and
# defaults to PHaRLAP:
#   l0: {name: iri, f107: 120}                 # PHaRLAP IRI-2020 (default)
#   l0: {name: iri, model: pyiri, f107: 120}   # PyIRI; topside H0 differs
# The default here stays `chapman` so that a run needs neither MATLAB nor PyIRI.
tiers:
  l0: chapman
  l1: analytic
  l2: baseline
  l3: baseline
  l4: lamination_magnetoionic
  l5: standard

# The requirement set L5 scores against.  Resolved by tss.config.resolve_path.
requirements: requirements/requirements

# Seed for the run.  The pipeline splits this per configuration, so two
# configurations in one campaign do not share a noise realisation.
seed: 20260921

instrument: instrument/baseline_6u

# The A1 stepped ionogram sweep of Requirements Rev G (INS-02, INS-27): steps
# of min(0.05 f, 150 kHz), each swept linearly in 26.8 ms.  159 steps over
# 0.33 to 20 MHz, 4.26 s, peak rate 5.6 MHz/s above 3 MHz.  The uniform
# 5.6 MHz/s sweep is withdrawn as an ionogram setting because its 78.4 kHz dwell
# at INS-04's 1050 km breaks INS-02 below 1.57 MHz (decision-table row 9,
# 2026-09-30).  k_f_hz_per_s is derived from the step law; a uniform sweep is
# still available by giving k_f_hz_per_s and removing step_dwell_s.
sweep:
  f_start_hz: 3.3e5
  f_stop_hz: 2.0e7
  step_dwell_s: 0.0268
  step_fraction: 0.05
  step_cap_hz: 1.5e5
  sweep_period_s: 0.0      # 0 means the active duration, 4.26 s for A1
  direction: 1
  nonlinearity_ppm: 0.0

grid:
  alt_min_m: 9.0e4
  alt_max_m: 2.0e6
  alt_step_m: 5.0e3

run:
  keep_intermediates: true
  strict_provenance: false   # campaigns for publication set this true

# The clutter generator (WP4 Phase 1, tss.l1_propagation.clutter): the returns
# that crowd a real topside ionogram besides the O and X traces.  On by default
# (decision D3, 2026-10-30) so every campaign tests the extractor against them;
# turn it off with --set clutter.enabled=false, or any term with its own
# `enabled`.  Strengths are declared, representative values (the module
# docstring says where each comes from); `climatology: true` makes spread-F
# occurrence, the D-region loss and the carrier level depend on latitude and
# local time.  Truth scoring never counts a clutter row.  The compression image
# is produced by L2's front end when the leakage compresses it; it is listed
# here, not generated.
clutter:
  enabled: true
  climatology: false
  ground_echo:              # above foF2, through the F layer to the Earth and back
    enabled: true
    surface_reflection_db: -3.0
    d_region_a_db_mhz2: 100.0   # two-way loss A / (f + f_L)^2, f in MHz
    d_region_f_l_mhz: 1.2
  spread_f:                 # oblique returns beyond the vertical echo
    enabled: true
    level_db: -6.0          # total, relative to the echo it accompanies
    rows_per_echo: 12
    mean_km: 30.0           # exponential offsets, truncated at extent_km
    extent_km: 100.0
    beyond_penetration_fraction: 0.05
  plasma_resonances:        # ringing at the spacecraft, across the range scale
    enabled: true
    row_spacing_km: 3.0
    extent_km: 1000.0
    floor_db: 30.0          # rows stop this far below the first
    fN:  {enabled: true, level_db: -70.0, decay_ms: 0.5}
    fUH: {enabled: true, level_db: -70.0, decay_ms: 1.0}
    nfH: {enabled: true, level_db: -70.0, decay_ms: 3.0, harmonics: 3}
  interference:             # HF broadcast carriers, which reach orbit only above foF2
    enabled: true
    carriers_per_band: 3
    power_dbm_iso: -70.0    # median, at an isotropic antenna
    sigma_db: 6.0
    raster_hz: 5000.0
    only_above_fof2: true
    # bands_mhz: ITU HF broadcast bands by default (tss.l1_propagation.clutter)
  compression_image:
    enabled: true
