# conda env create -f environment.yml && conda activate tss
#
# The conda route exists because iri2016 needs a Fortran compiler, and getting
# one on Windows any other way is more trouble than it is worth.  Everything
# else in here is available as a wheel, so a plain `pip install -e .[all]` in a
# virtualenv works too if IRI is not needed.
name: tss
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  # OpenBLAS, not MKL.  On Windows, conda-forge's MKL 2026 next to the LLVM
  # OpenMP runtime that fortran-compiler brings in fails to load on the first
  # matrix multiply (fatal exception 0xc06d007f).  Found 2026-09-23.
  - libblas=*=*openblas
  - scipy
  - matplotlib
  - pandas
  - pyyaml
  - requests
  - pytest
  - pytest-cov
  - ruff
  - fortran-compiler      # needed to build iri2016
  - cmake
  - pip
  - pip:
      - iri2016
      - PyIRI==0.1.7          # the l0 iri2020 tier; also brings netCDF4, cftime, fortranformat
      - ppigrf
      - sgp4
      - -e .
